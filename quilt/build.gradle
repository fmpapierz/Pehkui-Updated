// Quilt Standard Libraries stopped publishing after 1.21.1, and there is no quilt-loom or
// quilt-mappings build for 26.2. Quilt Loader itself is current and reads quilt.mod.json
// natively, so this project is compiled with Fabric Loom against Fabric Loader and Fabric API
// (both of which Quilt Loader runs) and ships Quilt's own metadata alongside Fabric's.
plugins { id 'net.fabricmc.fabric-loom' }

repositories {
	// Mod Menu, which supplies the mod list this mod's config button hangs off on Fabric and Quilt.
	maven { url = 'https://maven.terraformersmc.com/releases' }
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	implementation "com.terraformersmc:modmenu:${modmenu_version}"
	compileOnly 'org.jetbrains:annotations:26.0.2'
	compileOnly 'io.github.llamalad7:mixinextras-common:0.5.5'
	annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.5'
}

sourceSets.main {
	java.srcDir project(':common').file('src/main/java')
	java.srcDir project(':fabric').file('src/main/java')
	resources.srcDir project(':common').file('src/main/resources')
	resources.srcDir project(':fabric').file('src/main/resources')
}

loom {
	runs {
		client { runDir 'run' }
		server { runDir 'run-server' }
	}
}
