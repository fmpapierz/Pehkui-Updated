modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "${issues_url}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${homepage_url}"
iconFile = "assets/pehkui/icon.png"
authors = "Virtuoel"
credits = "Draylar, haykam821, Leximon, MerchantPug, TheGrimsey"
description = '''
${mod_description}
'''

[[mixins]]
config = "pehkui.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"
